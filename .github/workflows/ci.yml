name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    name: Rust Check & Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> src-tauri/target
            installer/src-tauri -> installer/src-tauri/target

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Installer Cargo Check
        run: cargo check --manifest-path installer/src-tauri/Cargo.toml

      - name: Installer Rust Format
        run: cargo fmt --manifest-path installer/src-tauri/Cargo.toml --all -- --check

      - name: Installer Cargo Clippy
        run: cargo clippy --manifest-path installer/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Installer Cargo Test
        run: cargo test --manifest-path installer/src-tauri/Cargo.toml

  frontend-build:
    name: Frontend & Website Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install App Dependencies
        run: npm ci

      - name: Build Launcher Frontend
        run: npm run build

      - name: Check release version consistency
        shell: pwsh
        run: .\scripts\check-version.ps1

      - name: Check locale parity
        shell: pwsh
        run: .\scripts\check-locales.ps1

      - name: Audit Launcher Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Installer Frontend
        run: npm --prefix installer run build

      - name: Audit Installer Dependencies
        run: npm --prefix installer audit --omit=dev --audit-level=high

      - name: Install Website Dependencies
        run: npm --prefix website ci

      - name: Lint Website
        run: npm --prefix website run lint

      - name: Audit Website Dependencies
        run: npm --prefix website audit --omit=dev --audit-level=high

      - name: Build Website
        run: npm --prefix website run build

  rustsec:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
